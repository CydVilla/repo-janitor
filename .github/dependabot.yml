version: 2
updates:
  # npm dependencies, one grouped PR per week — CI (typecheck + tests) gates it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-dependencies:
        patterns:
          - '*'
    open-pull-requests-limit: 5

  # The action versions pinned in .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'
